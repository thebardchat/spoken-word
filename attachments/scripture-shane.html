    .divider { width: 36px; height: 0.5px; background: #c8a96e; margin: 0 auto; opacity: 0.38; }

    #vt.quote { font-style: normal; color: #ede0c8; }
    #vr { font-size: 0.67rem; letter-spacing: 0.26em; text-transform: uppercase; color: #c8a96e; opacity: 0.65; font-weight: 400; }
    #vr.quote { color: #d4a85a; opacity: 0.78; letter-spacing: 0.18em; }

    /* ── Favorite heart ── */
    #fav-btn {
      position: absolute; right: -3rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 8px;
      font-size: 1.3rem; opacity: 0.25; transition: opacity 0.3s, transform 0.2s;
      color: #c8a96e; z-index: 5;
    }
    #fav-btn:hover { opacity: 0.8; transform: translateY(-50%) scale(1.2); }
    #fav-btn.active { opacity: 0.9; color: #e87070; }

    /* ── Progress bar ── */
    #pb { position: fixed; bottom: 0; left: 0; height: 1px; background: #c8a96e; opacity: 0.14; width: 0%; }

    /* ── Dots ── */
    #dots { position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; z-index: 3; pointer-events: none; flex-wrap: wrap; justify-content: center; max-width: 460px; }

    .dot.fav { background: #e87070; opacity: 0.5; }
    .dot.fav.on { opacity: 0.9; }

    /* ── Controls ── */
    .controls { position: fixed; top: 1rem; right: 1rem; display: flex; gap: 6px; z-index: 10; }
    .ctrl-btn {
      background: transparent; border: 0.5px solid rgba(200,169,110,0.2); color: rgba(200,169,110,0.45);
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.6rem;
      letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.35; transition: opacity 0.3s, border-color 0.3s;
    }
    .ctrl-btn:hover { opacity: 1; border-color: rgba(200,169,110,0.5); }
    .ctrl-btn.danger:hover { color: #e87070; border-color: rgba(232,112,112,0.4); }

    /* ── Pause indicator ── */
    #pind { position: fixed; bottom: 3.5rem; left: 50%; transform: translateX(-50%); color: rgba(200,169,110,0.45); font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; transition: opacity 0.4s; pointer-events: none; white-space: nowrap; }
    #vcnt { position: fixed; bottom: 1.35rem; right: 1.2rem; font-size: 0.58rem; letter-spacing: 0.18em; color: #c8a96e; opacity: 0.22; pointer-events: none; }
    #hint { position: fixed; bottom: 1.35rem; left: 1.2rem; font-size: 0.55rem; letter-spacing: 0.14em; color: #c8a96e; opacity: 0.18; pointer-events: none; }

    /* ════════════════════════════════════════════
       ADD VERSE PANEL
    ════════════════════════════════════════════ */
    #add-panel {
      position: fixed; inset: 0; background: rgba(8,6,3,0.96);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s;
    }
    #add-panel.open { opacity: 1; pointer-events: all; }
    .panel-inner {
      background: #110e09; border: 0.5px solid rgba(200,169,110,0.18);
      border-radius: 10px; padding: 2.4rem 2.2rem; width: min(520px, 90vw);
      display: flex; flex-direction: column; gap: 1rem;
    }
    .panel-title { font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: #c8a96e; opacity: 0.55; margin-bottom: 0.4rem; }
    .panel-inner textarea, .panel-inner input {
      background: #0c0905; border: 0.5px solid rgba(200,169,110,0.22);
      color: #f0e8d8; border-radius: 6px; padding: 0.85rem 1rem;
      font-family: 'EB Garamond','Palatino Linotype',Georgia,serif;
      font-size: 1.05rem; font-style: italic; resize: none; outline: none;
      transition: border-color 0.2s; width: 100%;

    .panel-inner input { font-style: normal; font-size: 0.78rem; font-family: system-ui,sans-serif; letter-spacing: 0.06em; }
    .panel-inner textarea:focus, .panel-inner input:focus { border-color: rgba(200,169,110,0.5); }
    .panel-inner textarea::placeholder, .panel-inner input::placeholder { color: rgba(200,169,110,0.25); font-style: italic; }
    .panel-inner input::placeholder { font-style: normal; }
    .panel-row { display: flex; gap: 0.7rem; align-items: center; }
    .type-toggle { display: flex; gap: 0; border: 0.5px solid rgba(200,169,110,0.2); border-radius: 6px; overflow: hidden; }
    .type-toggle button {
      background: transparent; border: none; color: rgba(200,169,110,0.4);
      padding: 6px 14px; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s, color 0.2s;
    }
    .type-toggle button.active { background: rgba(200,169,110,0.12); color: #c8a96e; }
    .panel-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.4rem; }
    .btn-cancel { background: transparent; border: 0.5px solid rgba(200,169,110,0.15); color: rgba(200,169,110,0.35); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; transition: opacity 0.2s; }

    .btn-save { background: rgba(200,169,110,0.1); border: 0.5px solid rgba(200,169,110,0.35); color: #c8a96e; padding: 7px 18px; border-radius: 6px; cursor: pointer; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; transition: background 0.2s; }
    .btn-save:hover { background: rgba(200,169,110,0.18); }

    /* ════════════════════════════════════════════

    ════════════════════════════════════════════ */
    #toast {

      color: #c8a96e; font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
      padding: 8px 18px; border-radius: 6px; opacity: 0; pointer-events: none;
      transition: opacity 0.4s; white-space: nowrap; z-index: 200;

       FAVORITES PANEL
    ════════════════════════════════════════════ */
    #fav-panel {
      position: fixed; inset: 0; background: rgba(8,6,3,0.96);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s;

    .fav-header span { font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: #c8a96e; opacity: 0.55; }
    .fav-list { overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; padding-right: 0.3rem; }

    .fav-list::-webkit-scrollbar-thumb { background: rgba(200,169,110,0.2); border-radius: 2px; }
    .fav-item {
      background: rgba(200,169,110,0.04); border: 0.5px solid rgba(200,169,110,0.1);

    .fav-item p { font-family: 'EB Garamond',Georgia,serif; font-style: italic; font-size: 0.95rem; color: #f0e8d8; line-height: 1.7; margin-bottom: 0.4rem; }
    .fav-item span { font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: #c8a96e; opacity: 0.5; }
    .fav-empty { text-align: center; color: rgba(200,169,110,0.25); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; padding: 2rem 0; }
  </style>
</head>

    { t: "Courage is fear that has said its prayers and decided to go forward anyway.", r: "— Joyce Meyer", q: true },
    { t: "You cannot have a positive life and a negative mind.", r: "— Joyce Meyer", q: true },
    { t: "God never said the road would be easy, but He said He would be with us every step of the way.", r: "— Joyce Meyer", q: true },
    { t: "You weren't an accident. You weren't mass produced. You were deliberately planned, specifically gifted, and lovingly positioned on the earth by the Master Craftsman.", r: "— Max Lucado", q: true },
    { t: "God loves you just the way you are, but He refuses to leave you that way.", r: "— Max Lucado", q: true },
    { t: "Our God specializes in turning messes into miracles.", r: "— Max Lucado", q: true },
    { t: "Our heart is restless, O Lord, until it finds its rest in Thee.", r: "— St. Augustine", q: true },
    { t: "Faith is to believe what you do not see; the reward of this faith is to see what you believe.", r: "— St. Augustine", q: true },
    { t: "Faith is taking the first step even when you don't see the whole staircase.", r: "— Martin Luther King Jr.", q: true },
    { t: "We must accept finite disappointment, but never lose infinite hope.", r: "— Martin Luther King Jr.", q: true },
    { t: "God's favor is not based on your performance; it is based on your relationship with Him.", r: "— Tony Evans", q: true },
    { t: "When you are in your darkest moment, do not close your eyes. Open your Bible.", r: "— Tony Evans", q: true },
    { t: "You cannot fix yourself. But you can present yourself to the One who can.", r: "— Tony Evans", q: true },
    { t: "Faith is not a sense, nor sight, nor reason, but taking God at His Word.", r: "— Oswald Chambers", q: true },
    { t: "God does not give us overcoming life. He gives us life as we overcome.", r: "— Oswald Chambers", q: true },
  ];

  // ═══════════════════════════════════════════════════════
  //  PERSISTENT STORAGE — localStorage
  //  Keys: sb_added_verses, sb_favorites
  // ═══════════════════════════════════════════════════════
  function loadAdded() {
    try { return JSON.parse(localStorage.getItem('sb_added_verses') || '[]'); } catch { return []; }
  }
  function saveAdded(arr) {
    try { localStorage.setItem('sb_added_verses', JSON.stringify(arr)); } catch {}
  }
  function loadFavs() {
    try { return JSON.parse(localStorage.getItem('sb_favorites') || '[]'); } catch { return []; }
  }
  function saveFavs(arr) {
    try { localStorage.setItem('sb_favorites', JSON.stringify(arr)); } catch {}
  }

  // Build full verse list: builtin + user-added
  let ADDED = loadAdded();
  let FAVS  = loadFavs(); // array of verse index refs (by text key)

  function buildList() {
    return [...BUILTIN, ...ADDED];
  }
  let V = buildList();

  function isFav(v) { return FAVS.includes(v.t); }

  // ═══════════════════════════════════════════════════════
  //  DOM refs
  // ═══════════════════════════════════════════════════════
  const vcEl   = document.getElementById('vc');
  const vtEl   = document.getElementById('vt');
  const vrEl   = document.getElementById('vr');
  const dotsEl = document.getElementById('dots');
  const pbEl   = document.getElementById('pb');
  const pindEl = document.getElementById('pind');
  const vcntEl = document.getElementById('vcnt');
  const pbtnEl = document.getElementById('pause-btn');
  const favBtn = document.getElementById('fav-btn');
  const toastEl= document.getElementById('toast');

  const FADE = 2500, HOLD = 10000;
  let cur = 0, timers = [], paused = false;

  // ═══════════════════════════════════════════════════════
  //  DOTS — rebuild when list changes
  // ═══════════════════════════════════════════════════════
  function buildDots() {
    dotsEl.innerHTML = '';
    V.forEach((v, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (isFav(v) ? ' fav' : '');
      dotsEl.appendChild(d);
    });
  }

  function setDots(i) {
    Array.from(dotsEl.children).forEach((d, j) => {
      const base = isFav(V[j]) ? 'dot fav' : 'dot';
      d.className = base + (j === i ? ' on' : '');
    });
  }

  // ═══════════════════════════════════════════════════════
  //  PLAYBACK
  // ═══════════════════════════════════════════════════════
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function startPB(ms) {
    pbEl.style.transition = 'none';
    pbEl.style.width = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      pbEl.style.transition = `width ${ms}ms linear`;
      pbEl.style.width = '100%';
    }));
  }

  function show(i) {
    clearTimers();
    const v = V[i];
    vtEl.textContent = v.t;
    vrEl.textContent = v.r;
    vtEl.className = v.q ? 'quote' : '';
    vrEl.className = v.q ? 'quote' : '';
    vcntEl.textContent = (i + 1) + ' / ' + V.length;
    setDots(i);
    favBtn.textContent = isFav(v) ? '♥' : '♡';
    favBtn.className   = isFav(v) ? 'active' : '';
    startPB(HOLD + FADE);
    vcEl.style.opacity = '1';
    timers.push(setTimeout(() => {
      vcEl.style.opacity = '0';
      timers.push(setTimeout(() => {
        cur = (i + 1) % V.length;
        show(cur);
      }, FADE + 120));
    }, HOLD));
  }

  function togglePause(e) {
    if (e) e.stopPropagation();
    paused = !paused;
    if (paused) { clearTimers(); pbEl.style.transition = 'none'; pindEl.style.opacity = '1'; pbtnEl.textContent = 'Resume'; }
    else { pindEl.style.opacity = '0'; pbtnEl.textContent = 'Pause'; show(cur); }
  }

  function prevVerse(e) {
    if (e) e.stopPropagation();
    clearTimers(); paused = false; pindEl.style.opacity = '0'; pbtnEl.textContent = 'Pause';
    vcEl.style.opacity = '0';
    setTimeout(() => { cur = (cur - 1 + V.length) % V.length; show(cur); }, 400);
  }

  function nextVerse() {
    clearTimers(); paused = false; pindEl.style.opacity = '0'; pbtnEl.textContent = 'Pause';
    vcEl.style.opacity = '0';
    setTimeout(() => { cur = (cur + 1) % V.length; show(cur); }, 400);
  }

  function goFS(e) {
    if (e) e.stopPropagation();
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  }

  // ═══════════════════════════════════════════════════════
  //  FAVORITES
  // ═══════════════════════════════════════════════════════
  favBtn.addEventListener('click', e => {
    e.stopPropagation();
    const v = V[cur];
    if (isFav(v)) {
      FAVS = FAVS.filter(t => t !== v.t);
      toast('Removed from saved');
    } else {
      FAVS.push(v.t);
      toast('Saved ♥');
    }
    saveFavs(FAVS);
    favBtn.textContent = isFav(v) ? '♥' : '♡';
    favBtn.className   = isFav(v) ? 'active' : '';
    setDots(cur);
  });

  function openFavPanel(e) {
    e.stopPropagation();
    renderFavList();
    document.getElementById('fav-panel').classList.add('open');
  }
  function closeFavPanel() {
    document.getElementById('fav-panel').classList.remove('open');
  }
  function renderFavList() {
    const list = document.getElementById('fav-list');
    const saved = V.filter(v => isFav(v));
    if (!saved.length) {
      list.innerHTML = '<div class="fav-empty">No saved verses yet.<br>Tap ♡ on any verse to save it.</div>';
      return;
    }
    list.innerHTML = '';
    saved.forEach((v, i) => {
      const el = document.createElement('div');
      el.className = 'fav-item';
      el.innerHTML = `<p>${v.t}</p><span>${v.r}</span>`;
      el.addEventListener('click', () => {
        const idx = V.findIndex(x => x.t === v.t);
        if (idx !== -1) { cur = idx; show(cur); }
        closeFavPanel();
      });
      list.appendChild(el);
    });
  }

  // ═══════════════════════════════════════════════════════
  //  ADD VERSE PANEL
  // ═══════════════════════════════════════════════════════
  let addType = 'scripture';

  function openAddPanel(e) {
    e.stopPropagation();
    document.getElementById('add-panel').classList.add('open');
    document.getElementById('add-text').focus();
  }
  function closeAddPanel() {
    document.getElementById('add-panel').classList.remove('open');
    document.getElementById('add-text').value = '';
    document.getElementById('add-ref').value = '';
    setType('scripture');
  }
  function setType(t) {
    addType = t;
    document.getElementById('type-scripture').className = t === 'scripture' ? 'active' : '';
    document.getElementById('type-quote').className     = t === 'quote'     ? 'active' : '';
  }
  function saveVerse() {
    const text = document.getElementById('add-text').value.trim();
    const ref  = document.getElementById('add-ref').value.trim();
    if (!text) { toast('Add the verse text first'); return; }
    const entry = { t: text, r: ref || '', q: addType === 'quote', added: true };
    ADDED.push(entry);
    saveAdded(ADDED);
    V = buildList();
    buildDots();
    closeAddPanel();
    // jump to the new verse
    cur = V.length - 1;
    vcEl.style.opacity = '0';
    setTimeout(() => show(cur), 300);
    toast('Added to your display ✓');
  }

  // ═══════════════════════════════════════════════════════
  //  TOAST
  // ═══════════════════════════════════════════════════════
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, 2200);
  }

  // ═══════════════════════════════════════════════════════
  //  KEYBOARD
  // ═══════════════════════════════════════════════════════
  document.body.addEventListener('click', e => {
    if (e.target.closest('.ctrl-btn') || e.target.closest('#add-panel') || e.target.closest('#fav-panel') || e.target.closest('#fav-btn')) return;
    togglePause(null);
  });

  document.addEventListener('keydown', e => {
    const addOpen = document.getElementById('add-panel').classList.contains('open');
    const favOpen = document.getElementById('fav-panel').classList.contains('open');
    if (addOpen || favOpen) {
      if (e.key === 'Escape') { closeAddPanel(); closeFavPanel(); }
      return;
    }
    if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); togglePause(null); }
    if (e.key === 'ArrowRight') nextVerse();
    if (e.key === 'ArrowLeft')  prevVerse(null);
    if (e.key === 'f' || e.key === 'F') goFS(null);
    if (e.key === 'a' || e.key === 'A') openAddPanel({ stopPropagation: () => {} });
  });

  // ═══════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════
  buildDots();
  setTimeout(() => show(0), 600);
  </script>
</body>
</html>
